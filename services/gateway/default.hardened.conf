log_format lab '$remote_addr [$time_local] "$request" $status rt=$request_time urt=$upstream_response_time';
access_log /dev/stdout lab;

# Load shedding: limita peticiones por IP hacia /consulta
limit_req_zone $binary_remote_addr zone=consulta:10m rate=5r/s;

server {
    listen 8080;

    location /consulta {
        limit_req zone=consulta burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:5000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://api:5000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
