log_format lab '$remote_addr [$time_local] "$request" $status rt=$request_time urt=$upstream_response_time';
access_log /dev/stdout lab;

# --- Bloque P3: Load shedding en gateway hacia /consulta ---
# Limita tasa de solicitudes (rate) y conexiones simultaneas (conn) por IP cliente.
limit_req_zone $binary_remote_addr zone=consulta_req:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=consulta_conn:10m;

server {
    listen 8080;
    # [P4] Aqui se integrara TLS/mTLS sin modificar las politicas P3 de /consulta.

    proxy_ssl_certificate /etc/nginx/certs/gateway.crt;
    proxy_ssl_certificate_key /etc/nginx/certs/gateway.key;
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name api;

    # Endpoint critico de analisis IA: protegido con limit_req + limit_conn -> HTTP 429
    location /consulta {
        limit_req zone=consulta_req burst=6 nodelay;
        limit_req_status 429;
        limit_conn consulta_conn 6;
        limit_conn_status 429;
        error_page 429 @rate_limited;

        proxy_pass https://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 7s;
    }

    # Respuesta JSON clara + Retry-After cuando Nginx descarta carga excesiva
    location @rate_limited {
        default_type application/json;
        add_header Retry-After "2" always;
        return 429 '{"status":"rate_limited","degraded":true,"error":"demasiadas solicitudes hacia /consulta","retry_after_seconds":2}\n';
    }

    # Endpoints independientes (/health, /citas): sin rate limit para preservar disponibilidad
    location / {
        proxy_pass https://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }
}
